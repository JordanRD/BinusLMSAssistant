<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BINUS LMS Forum Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --success: #16a34a;
        --success-bg: #dcfce7;
        --warning: #ea580c;
        --warning-bg: #ffedd5;
        --danger: #dc2626;
        --danger-bg: #fee2e2;
        --radius: 10px;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
        --card-shadow:
          0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090d16;
          --surface: #131b2e;
          --surface-border: #23304c;
          --text: #f1f5f9;
          --text-muted: #94a3b8;
          --primary: #3b82f6;
          --primary-hover: #60a5fa;
          --success: #22c55e;
          --success-bg: #052e16;
          --warning: #f97316;
          --warning-bg: #431407;
          --danger: #ef4444;
          --danger-bg: #450a0a;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
          --card-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: var(--bg);
        color: var(--text);
        line-height: 1.5;
        padding: 24px;
        min-height: 100vh;
      }

      .container {
        max-width: 1080px;
        margin: 0 auto;
      }

      /* Header */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
        padding-bottom: 20px;
        border-bottom: 1px solid var(--surface-border);
        margin-bottom: 24px;
      }

      .brand-title {
        font-size: 1.5rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .user-pill {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--surface-border);
        padding: 6px 14px;
        border-radius: 9999px;
        font-size: 0.875rem;
        box-shadow: var(--shadow);
      }

      .user-pill span {
        color: var(--text-muted);
      }
      .user-pill strong {
        color: var(--text);
        font-weight: 600;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-family: inherit;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 8px 16px;
        border-radius: var(--radius);
        border: none;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .btn-primary {
        background-color: var(--primary);
        color: #ffffff;
      }
      .btn-primary:hover:not(:disabled) {
        background-color: var(--primary-hover);
        transform: translateY(-1px);
      }

      .btn-secondary {
        background-color: var(--surface);
        border: 1px solid var(--surface-border);
        color: var(--text);
      }
      .btn-secondary:hover:not(:disabled) {
        background-color: var(--surface-border);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Filter Bar */
      .filter-panel {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        padding: 18px 20px;
        margin-bottom: 24px;
        box-shadow: var(--shadow);
      }

      .filter-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        align-items: end;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .form-group label {
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
      }

      select,
      input[type="text"] {
        width: 100%;
        padding: 9px 12px;
        font-size: 0.925rem;
        font-family: inherit;
        color: var(--text);
        background-color: var(--bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        outline: none;
        transition: border-color 0.15s;
      }

      select:focus {
        border-color: var(--primary);
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
        margin-bottom: 8px;
      }

      .checkbox-label input {
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }

      /* Status Banner */
      .status-bar {
        font-size: 0.875rem;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--surface-border);
        color: var(--text-muted);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      /* Cards Feed */
      .feed-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .feed-header h2 {
        font-size: 1.25rem;
        font-weight: 700;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 20px;
        box-shadow: var(--card-shadow);
        transition: border-color 0.2s;
      }

      .card:hover {
        border-color: #cbd5e1;
      }
      @media (prefers-color-scheme: dark) {
        .card:hover {
          border-color: #334155;
        }
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .thread-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
        line-height: 1.4;
      }

      .badge-group {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .badge-session {
        background-color: var(--bg);
        color: var(--text-muted);
        border: 1px solid var(--surface-border);
      }

      .badge-lecturer {
        background-color: #eff6ff;
        color: #1d4ed8;
        border: 1px solid #bfdbfe;
      }
      @media (prefers-color-scheme: dark) {
        .badge-lecturer {
          background-color: #1e3a8a;
          color: #93c5fd;
          border-color: #1d4ed8;
        }
      }

      .badge-replied {
        background-color: var(--success-bg);
        color: var(--success);
        border: 1px solid rgba(22, 163, 74, 0.25);
      }

      .badge-unanswered {
        background-color: var(--warning-bg);
        color: var(--warning);
        border: 1px solid rgba(234, 88, 12, 0.25);
      }

      /* Question Prompt Box */
      .question-box {
        background-color: var(--bg);
        border-left: 4px solid var(--primary);
        padding: 14px 16px;
        border-radius: 4px var(--radius) var(--radius) 4px;
        margin-bottom: 18px;
        font-size: 0.95rem;
        line-height: 1.6;
      }

      .question-box h4 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      /* Answered Status Callout */
      .replied-notice {
        display: flex;
        align-items: center;
        gap: 10px;
        background-color: var(--success-bg);
        border: 1px solid rgba(22, 163, 74, 0.3);
        color: var(--success);
        padding: 10px 14px;
        border-radius: var(--radius);
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 16px;
      }

      /* Answer Area */
      .answer-area {
        margin-top: 14px;
      }

      .answer-area textarea {
        width: 100%;
        min-height: 90px;
        padding: 12px 14px;
        font-family: inherit;
        font-size: 0.925rem;
        color: var(--text);
        background-color: var(--bg);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        resize: vertical;
        outline: none;
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }

      .answer-area textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .card-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        gap: 12px;
      }

      .submit-feedback {
        font-size: 0.85rem;
        font-weight: 500;
      }
      .submit-feedback.success {
        color: var(--success);
      }
      .submit-feedback.error {
        color: var(--danger);
      }

      /* Empty and Loading State */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-muted);
        background: var(--surface);
        border: 1px dashed var(--surface-border);
        border-radius: var(--radius);
      }

      .empty-state h3 {
        font-size: 1.1rem;
        margin-bottom: 6px;
        color: var(--text);
      }

      .spinner {
        display: inline-block;
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-radius: 50%;
        border-top-color: #ffffff;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Modal Styles */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.65);
        backdrop-filter: blur(5px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 16px;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .modal-overlay.active {
        display: flex;
        opacity: 1;
      }

      .modal-container {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 16px;
        width: 100%;
        max-width: 820px;
        max-height: 88vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        animation: modalSlideUp 0.22s ease-out;
      }

      @keyframes modalSlideUp {
        from {
          transform: translateY(12px) scale(0.98);
          opacity: 0;
        }
        to {
          transform: translateY(0) scale(1);
          opacity: 1;
        }
      }

      .modal-header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--surface-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        background: var(--surface);
      }

      .modal-title-area {
        flex: 1;
        min-width: 0;
      }

      .modal-title-area h3 {
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .modal-title-area p {
        font-size: 0.825rem;
        color: var(--text-muted);
        margin-top: 2px;
      }

      .modal-close-btn {
        background: transparent;
        border: 1px solid var(--surface-border);
        color: var(--text-muted);
        font-size: 1.25rem;
        line-height: 1;
        cursor: pointer;
        width: 34px;
        height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
        flex-shrink: 0;
      }

      .modal-close-btn:hover {
        background: var(--surface-border);
        color: var(--text);
      }

      .modal-body {
        padding: 22px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* Pinned My Answer */
      .pinned-my-answer {
        background: #f0fdf4;
        border: 2px solid #86efac;
        border-radius: 12px;
        padding: 16px;
        position: relative;
      }

      @media (prefers-color-scheme: dark) {
        .pinned-my-answer {
          background: #052e16;
          border-color: #166534;
        }
      }

      .pinned-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background-color: #16a34a;
        color: #ffffff;
        font-size: 0.75rem;
        font-weight: 700;
        padding: 3px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      /* Quick Reply in Modal */
      .modal-reply-box {
        background: var(--bg);
        border: 1px solid var(--surface-border);
        border-radius: 12px;
        padding: 16px;
      }

      .modal-reply-box textarea {
        width: 100%;
        min-height: 80px;
        padding: 10px 12px;
        font-family: inherit;
        font-size: 0.9rem;
        color: var(--text);
        background-color: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: var(--radius);
        resize: vertical;
        outline: none;
      }

      .modal-reply-box textarea:focus {
        border-color: var(--primary);
      }

      /* Comments Tree & Nested Styling */
      .comment-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .comment-card {
        background: var(--surface);
        border: 1px solid var(--surface-border);
        border-radius: 10px;
        padding: 14px 16px;
        transition: border-color 0.15s ease;
      }

      .comment-card.is-me {
        border-color: #22c55e;
        background: rgba(34, 197, 94, 0.04);
      }

      .comment-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }

      .comment-author-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .avatar-circle {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: #ffffff;
        font-weight: 700;
        font-size: 0.75rem;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .avatar-circle.is-me {
        background: linear-gradient(135deg, #22c55e, #15803d);
      }

      .avatar-circle.is-instructor {
        background: linear-gradient(135deg, #f59e0b, #b45309);
      }

      .author-name-text {
        font-weight: 600;
        font-size: 0.885rem;
        color: var(--text);
      }

      .comment-text-body {
        font-size: 0.9rem;
        line-height: 1.6;
        color: var(--text);
        word-break: break-word;
      }

      .comment-text-body p {
        margin-bottom: 8px;
      }

      .comment-text-body p:last-child {
        margin-bottom: 0;
      }

      /* Nested Replies List */
      .replies-nested-list {
        margin-top: 12px;
        margin-left: 20px;
        padding-left: 14px;
        border-left: 2px solid var(--surface-border);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header>
        <div class="brand-title">
          <span>🎓</span>
          <span>BINUS LMS Forum Assistant</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center">
          <div class="user-pill" id="userPill">
            <span>Loading user profile...</span>
          </div>
          <button
            class="btn btn-secondary"
            id="reloginBtn"
            onclick="triggerRelogin()"
          >
            🔑 Re-Login
          </button>
        </div>
      </header>

      <!-- Filters Panel -->
      <div class="filter-panel">
        <div class="filter-grid">
          <div class="form-group">
            <label for="periodSelect">📅 Academic Period</label>
            <select id="periodSelect" onchange="onPeriodChange()">
              <option value="">Loading periods...</option>
            </select>
          </div>

          <div class="form-group" style="grid-column: span 1.5">
            <label for="subjectSelect">📚 Subject</label>
            <select id="subjectSelect" onchange="onSubjectChange()">
              <option value="">Select subject...</option>
            </select>
          </div>

          <div class="form-group" style="grid-column: span 1.5">
            <label for="sessionSelect">🏷️ Session Filter</label>
            <select id="sessionSelect" onchange="onSessionChange()">
              <option value="">Loading sessions...</option>
            </select>
          </div>

          <div>
            <label class="checkbox-label">
              <input
                type="checkbox"
                id="unansweredOnly"
                onchange="filterPostsClientSide()"
              />
              <span>Show Unanswered Only</span>
            </label>
            <button
              class="btn btn-primary"
              style="width: 100%"
              id="fetchBtn"
              onclick="fetchPosts()"
            >
              🔄 Fetch Posts
            </button>
          </div>
        </div>

        <div class="status-bar">
          <span id="statusBar">Ready.</span>
          <span id="countBar"></span>
        </div>
      </div>

      <!-- Feed Section -->
      <div class="feed-header">
        <h2>📋 Lecturer Questions</h2>
      </div>

      <div id="postsFeed">
        <div class="empty-state">
          <h3>No subjects loaded</h3>
          <p>Please select an Academic Period and Subject above.</p>
        </div>
      </div>
    </div>

    <!-- Modal Answers Overlay -->
    <div
      class="modal-overlay"
      id="commentsModalOverlay"
      onclick="handleModalOverlayClick(event)"
    >
      <div class="modal-container">
        <div class="modal-header">
          <div class="modal-title-area">
            <h3 id="modalThreadTitle">Judul Pertanyaan</h3>
            <p id="modalThreadSubtitle">Memuat jawaban...</p>
          </div>
          <button
            class="modal-close-btn"
            onclick="closeCommentsModal()"
            title="Tutup (Esc)"
          >
            ✕
          </button>
        </div>

        <div class="modal-body" id="modalCommentsBody">
          <!-- Pinned / Highlight Jawaban Anda -->
          <div id="modalPinnedSection"></div>

          <!-- Form Tambah Jawaban di Dalam Modal -->
          <div class="modal-reply-box">
            <label
              style="
                font-size: 0.8rem;
                font-weight: 600;
                text-transform: uppercase;
                color: var(--text-muted);
                display: block;
                margin-bottom: 6px;
              "
            >
              ✍️ Kirim Jawaban Cepat
            </label>
            <textarea
              id="modalReplyText"
              placeholder="Tulis jawaban Anda di sini..."
            ></textarea>
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: 8px;
                gap: 12px;
                flex-wrap: wrap;
              "
            >
              <button
                class="btn btn-primary"
                id="modalSubmitBtn"
                onclick="submitModalAnswer()"
              >
                🚀 Kirim Jawaban
              </button>
              <span class="submit-feedback" id="modalFeedback"></span>
            </div>
          </div>

          <!-- Section List Semua Jawaban -->
          <div>
            <div
              style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 12px;
              "
            >
              <h4 style="font-size: 0.95rem; font-weight: 700">
                Semua Jawaban Diskusi
              </h4>
              <span id="modalTotalCommentsBadge" class="badge badge-session"
                >0 Jawaban</span
              >
            </div>

            <div id="modalCommentsList" class="comment-list">
              <!-- Comments injected here -->
            </div>

            <div
              id="modalLoadingSpinner"
              style="text-align: center; padding: 20px; display: none"
            >
              <span
                class="spinner"
                style="
                  border-top-color: var(--primary);
                  width: 24px;
                  height: 24px;
                "
              ></span>
              <p
                style="
                  font-size: 0.85rem;
                  color: var(--text-muted);
                  margin-top: 8px;
                "
              >
                Memuat jawaban...
              </p>
            </div>

            <div
              class="load-more-container"
              id="modalLoadMoreContainer"
              style="display: none; margin-top: 16px"
            >
              <button
                class="btn btn-secondary"
                id="modalLoadMoreBtn"
                onclick="loadMoreModalComments()"
                style="width: 100%"
              >
                ⬇️ Muat Lebih Banyak Jawaban
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let currentCourses = [];
      let currentThreads = [];
      let currentClassId = "";
      let currentUserId = "";

      // Modal state
      let activeModalThreadId = null;
      let modalCurrentPage = 1;
      let modalTotalComments = 0;
      let modalCommentsList = [];
      let modalIsLoading = false;

      // On page load
      document.addEventListener("DOMContentLoaded", () => {
        loadInitData();
      });

      async function loadInitData() {
        setStatus("⏳ Initializing session and loading academic periods...");
        try {
          const res = await fetch("/api/init");
          const data = await res.json();

          if (data.error) {
            setStatus(`⚠️ ${data.error}`);
            document.getElementById("userPill").innerHTML =
              `<span style="color:var(--danger)">Not authenticated</span>`;
            return;
          }

          // Render user pill
          const user = data.user;
          document.getElementById("userPill").innerHTML = `
          <strong>${user.name}</strong>
          <span>•</span>
          <span>${user.role} (${user.academicCareer})</span>
        `;

          // Render periods
          const periodSelect = document.getElementById("periodSelect");
          periodSelect.innerHTML = "";
          data.periods.forEach((p) => {
            const opt = document.createElement("option");
            opt.value = p.code;
            opt.textContent = `${p.code} - ${p.description}${p.isRunning ? " (Active)" : ""}`;
            if (p.code === data.activePeriod) {
              opt.selected = true;
            }
            periodSelect.appendChild(opt);
          });

          // Set courses
          renderSubjectOptions(data.courses);

          setStatus("✅ Ready.");
          if (data.courses.length > 0) {
            onSubjectChange();
          }
        } catch (err) {
          setStatus(`❌ Network error initializing: ${err.message}`);
        }
      }

      function renderSubjectOptions(courses) {
        currentCourses = courses || [];
        const select = document.getElementById("subjectSelect");
        select.innerHTML = "";

        if (currentCourses.length === 0) {
          select.innerHTML = `<option value="">No subjects found for this period</option>`;
          return;
        }

        currentCourses.forEach((c, idx) => {
          const opt = document.createElement("option");
          opt.value = idx;
          opt.textContent = c.courseName;
          select.appendChild(opt);
        });
      }

      async function onPeriodChange() {
        const period = document.getElementById("periodSelect").value;
        if (!period) return;
        setStatus(`⏳ Fetching subjects for period ${period}...`);
        try {
          const res = await fetch(
            `/api/subjects?period=${encodeURIComponent(period)}`,
          );
          const data = await res.json();
          renderSubjectOptions(data.courses);
          setStatus(`✅ Loaded ${data.courses.length} subjects.`);
          if (data.courses.length > 0) {
            onSubjectChange();
          } else {
            document.getElementById("postsFeed").innerHTML = `
            <div class="empty-state">
              <h3>No subjects found for period ${period}</h3>
            </div>
          `;
          }
        } catch (err) {
          setStatus(`❌ Error loading subjects: ${err.message}`);
        }
      }

      async function onSubjectChange() {
        const subjectIdx = document.getElementById("subjectSelect").value;
        if (subjectIdx === "" || !currentCourses[subjectIdx]) {
          setStatus("⚠️ Please select a subject first.");
          return;
        }

        const course = currentCourses[subjectIdx];
        const classId = course.classId;
        currentClassId = classId;
        const sessionSelect = document.getElementById("sessionSelect");
        sessionSelect.innerHTML = `<option value="">Loading sessions...</option>`;
        setStatus(`⏳ Loading sessions for ${course.courseName}...`);

        try {
          const res = await fetch(
            `/api/sessions?class_id=${encodeURIComponent(classId)}`,
          );
          const data = await res.json();

          if (data.error) {
            setStatus(`❌ Error loading sessions: ${data.error}`);
            sessionSelect.innerHTML = `<option value="ALL">All Sessions</option>`;
            return;
          }

          const sessions = data.sessions || [];
          sessionSelect.innerHTML = "";

          if (sessions.length === 0) {
            sessionSelect.innerHTML = `<option value="">No sessions available</option>`;
            return;
          }

          let activeOptionVal = null;
          sessions.forEach((s) => {
            const opt = document.createElement("option");
            opt.value = s.sessionId;
            let label = `Session ${s.classSessionNumber}: ${s.topicName}`;
            if (s.isActive) {
              label += " ⭐ (Active)";
              activeOptionVal = s.sessionId;
            }
            opt.textContent = label;
            sessionSelect.appendChild(opt);
          });

          // By default, select the current active session of the current subject!
          if (activeOptionVal) {
            sessionSelect.value = activeOptionVal;
          } else if (data.activeSessionId) {
            sessionSelect.value = data.activeSessionId;
          } else if (sessions.length > 0) {
            sessionSelect.value = sessions[sessions.length - 1].sessionId;
          }

          // Fetch posts for the active session
          fetchPosts();
        } catch (err) {
          setStatus(`❌ Error loading sessions: ${err.message}`);
        }
      }

      function onSessionChange() {
        fetchPosts();
      }

      let fetchAbortController = null;

      async function fetchPosts() {
        const subjectIdx = document.getElementById("subjectSelect").value;
        if (subjectIdx === "" || !currentCourses[subjectIdx]) {
          setStatus("⚠️ Please select a subject first.");
          return;
        }

        const course = currentCourses[subjectIdx];
        const classId = course.classId;
        currentClassId = classId;
        const sessionSelect = document.getElementById("sessionSelect");
        const sessionId = sessionSelect.value;
        if (!sessionId) {
          setStatus("⚠️ Please select a session.");
          return;
        }

        if (fetchAbortController) {
          fetchAbortController.abort();
        }
        fetchAbortController = new AbortController();

        const fetchBtn = document.getElementById("fetchBtn");
        fetchBtn.disabled = true;
        fetchBtn.innerHTML = `<span class="spinner"></span> Loading...`;

        const selectedOptionText = sessionSelect.options[
          sessionSelect.selectedIndex
        ]
          ? sessionSelect.options[sessionSelect.selectedIndex].text
          : "";
        setStatus(
          `⏳ Fetching posts for ${course.courseName} (${selectedOptionText})...`,
        );

        try {
          const url = `/api/posts?class_id=${encodeURIComponent(classId)}&session_id=${encodeURIComponent(sessionId)}`;
          const res = await fetch(url, { signal: fetchAbortController.signal });
          const data = await res.json();

          if (data.error) {
            setStatus(`❌ ${data.error}`);
            document.getElementById("postsFeed").innerHTML = `
            <div class="empty-state">
              <h3>Error loading forum posts</h3>
              <p>${data.error}</p>
            </div>
          `;
            return;
          }

          currentThreads = data.threads || [];
          renderThreads();
          setStatus(
            `✅ Loaded ${currentThreads.length} lecturer posts for ${course.courseName}.`,
          );
        } catch (err) {
          if (err.name === "AbortError") return;
          setStatus(`❌ Network error fetching posts: ${err.message}`);
        } finally {
          fetchBtn.disabled = false;
          fetchBtn.innerHTML = `🔄 Fetch Posts`;
        }
      }

      function filterPostsClientSide() {
        renderThreads();
      }

      function formatDisplayDate(dateStr) {
        if (!dateStr) return "-";
        try {
          const clean = dateStr.replace("Z", "");
          const d = new Date(clean);
          if (isNaN(d.getTime())) return dateStr;
          return d.toLocaleDateString("id-ID", {
            day: "numeric",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return dateStr;
        }
      }

      function renderThreads() {
        const container = document.getElementById("postsFeed");
        const sessionSelect = document.getElementById("sessionSelect");
        const unansweredOnly =
          document.getElementById("unansweredOnly").checked;
        const selectedSessionText = sessionSelect.options[
          sessionSelect.selectedIndex
        ]
          ? sessionSelect.options[sessionSelect.selectedIndex].text
          : "";

        let filtered = currentThreads.filter((t) => {
          if (unansweredOnly && t.hasReplied) {
            return false;
          }
          return true;
        });

        document.getElementById("countBar").textContent =
          `Showing ${filtered.length} of ${currentThreads.length} posts`;

        if (filtered.length === 0) {
          let msg = "No lecturer posts found in this session.";
          let tip =
            "Try selecting another session from the Session Filter dropdown above.";
          if (unansweredOnly && currentThreads.length > 0) {
            msg = "All questions in this session have already been answered!";
            tip = "Uncheck 'Show Unanswered Only' to review your answers.";
          }

          container.innerHTML = `
          <div class="empty-state">
            <h3>${msg}</h3>
            <p>${selectedSessionText ? "Filter: " + selectedSessionText : ""}</p>
            <p style="margin-top: 10px; font-size: 0.9rem; color: var(--primary);">${tip}</p>
          </div>
        `;
          return;
        }

        container.innerHTML = "";
        filtered.forEach((t, i) => {
          const card = document.createElement("div");
          card.className = "card";
          card.id = `card-${t.threadId}`;

          const statusBadge = t.hasReplied
            ? `<span class="badge badge-replied">🟢 Replied by You</span>`
            : `<span class="badge badge-unanswered">🟠 Not Replied Yet</span>`;

          let replyNoticeHtml = "";
          if (t.hasReplied && t.replyDate) {
            replyNoticeHtml = `
            <div class="replied-notice">
              <span>✅</span>
              <span>Sudah dijawab pada: <strong>${formatDisplayDate(t.replyDate)}</strong></span>
            </div>
          `;
          }

          card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="thread-title">📌 ${escapeHtml(t.title)}</div>
              <div class="badge-group" style="margin-top: 8px;">
                <span class="badge badge-session">🏷️ Session ${t.sessionNumber}: ${escapeHtml(t.topicName || "")}</span>
                <span class="badge badge-lecturer">👨‍🏫 ${escapeHtml(t.authorName)} (${t.authorRole})</span>
                ${statusBadge}
              </div>
            </div>
          </div>

          <div class="question-box">
            <h4>Question Prompt</h4>
            <div>${escapeHtml(t.questionText)}</div>
          </div>

          <div style="margin-bottom: 14px;">
            <button class="btn btn-secondary" onclick="openCommentsModal('${t.threadId}')">
              💬 Lihat Semua Jawaban
            </button>
          </div>

          ${replyNoticeHtml}

          <div class="answer-area">
            <label style="font-size:0.8rem; font-weight:600; text-transform:uppercase; color:var(--text-muted); display:block; margin-bottom:6px;">
              ✍️ ${t.hasReplied ? "Kirim Jawaban Tambahan" : "Jawaban Anda"}
            </label>
            <textarea id="reply-${t.threadId}" placeholder="Type your answer here..."></textarea>
            <div class="card-actions">
              <button class="btn btn-primary" onclick="submitAnswer('${t.threadId}')">
                🚀 Submit Answer
              </button>
              <span class="submit-feedback" id="feedback-${t.threadId}"></span>
            </div>
          </div>
        `;
          container.appendChild(card);
        });
      }

      async function submitAnswer(threadId) {
        const textarea = document.getElementById(`reply-${threadId}`);
        const feedback = document.getElementById(`feedback-${threadId}`);
        const answerText = textarea.value.trim();

        if (!answerText) {
          feedback.className = "submit-feedback error";
          feedback.textContent = "⚠️ Answer cannot be empty.";
          return;
        }

        feedback.className = "submit-feedback";
        feedback.textContent = "Submitting answer...";

        const threadObj = currentThreads.find((x) => x.threadId === threadId);

        try {
          const res = await fetch("/api/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              thread_id: threadId,
              answer_text: answerText,
              class_id: currentClassId,
              session_id: threadObj ? threadObj.sessionId : null,
            }),
          });

          const data = await res.json();
          if (data.success) {
            feedback.className = "submit-feedback success";
            feedback.textContent = "🎉 Answer posted successfully!";
            textarea.value = "";

            // Update local memory & UI
            if (threadObj) {
              threadObj.hasReplied = true;
              threadObj.replyText = answerText;
              threadObj.replyDate = new Date().toISOString();
            }
            // Re-render
            setTimeout(() => {
              renderThreads();
            }, 800);
          } else {
            feedback.className = "submit-feedback error";
            feedback.textContent = `❌ Failed: ${data.error}`;
          }
        } catch (err) {
          feedback.className = "submit-feedback error";
          feedback.textContent = `❌ Error: ${err.message}`;
        }
      }

      function setStatus(msg) {
        document.getElementById("statusBar").textContent = msg;
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      // Modal management functions
      function openCommentsModal(threadId) {
        activeModalThreadId = threadId;
        modalCurrentPage = 1;
        modalCommentsList = [];
        modalTotalComments = 0;

        const threadObj = currentThreads.find((x) => x.threadId === threadId);
        const titleElem = document.getElementById("modalThreadTitle");
        const subElem = document.getElementById("modalThreadSubtitle");
        const textarea = document.getElementById("modalReplyText");
        const feedback = document.getElementById("modalFeedback");

        if (threadObj) {
          titleElem.textContent = threadObj.title || "Pertanyaan Forum";
          subElem.textContent = `Session ${threadObj.sessionNumber || "-"}: ${threadObj.topicName || ""} • Dosen: ${threadObj.authorName || "Instructor"} (${threadObj.authorRole || ""})`;
        } else {
          titleElem.textContent = "Pertanyaan Forum";
          subElem.textContent = "Memuat diskusi...";
        }

        if (textarea) textarea.value = "";
        if (feedback) {
          feedback.className = "submit-feedback";
          feedback.textContent = "";
        }

        document.getElementById("modalPinnedSection").innerHTML = "";
        document.getElementById("modalCommentsList").innerHTML = "";
        document.getElementById("modalTotalCommentsBadge").textContent =
          "0 Jawaban";
        document.getElementById("modalLoadMoreContainer").style.display =
          "none";

        const overlay = document.getElementById("commentsModalOverlay");
        overlay.classList.add("active");
        document.body.style.overflow = "hidden";

        fetchModalComments(1, false);
      }

      function closeCommentsModal() {
        const overlay = document.getElementById("commentsModalOverlay");
        overlay.classList.remove("active");
        document.body.style.overflow = "";
        activeModalThreadId = null;
      }

      function handleModalOverlayClick(event) {
        if (event.target.id === "commentsModalOverlay") {
          closeCommentsModal();
        }
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          const overlay = document.getElementById("commentsModalOverlay");
          if (overlay && overlay.classList.contains("active")) {
            closeCommentsModal();
          }
        }
      });

      async function fetchModalComments(page = 1, append = false) {
        if (!activeModalThreadId || !currentClassId) return;
        if (modalIsLoading) return;

        modalIsLoading = true;
        const spinner = document.getElementById("modalLoadingSpinner");
        const loadMoreContainer = document.getElementById(
          "modalLoadMoreContainer",
        );
        const loadMoreBtn = document.getElementById("modalLoadMoreBtn");

        spinner.style.display = "block";
        loadMoreContainer.style.display = "none";

        try {
          const url = `/api/comments?class_id=${encodeURIComponent(currentClassId)}&thread_id=${encodeURIComponent(activeModalThreadId)}&page=${page}&limit=25`;
          const res = await fetch(url);
          const data = await res.json();

          if (data.error) {
            document.getElementById("modalCommentsList").innerHTML = `
            <div style="text-align:center; padding:20px; color:var(--danger);">
              Gagal memuat jawaban: ${escapeHtml(data.error)}
            </div>
          `;
            return;
          }

          if (data.currentUserId) {
            currentUserId = data.currentUserId;
          }

          modalTotalComments = data.total || 0;
          const newComments = data.comments || [];

          if (append) {
            modalCommentsList = modalCommentsList.concat(newComments);
          } else {
            modalCommentsList = newComments;
          }

          const threadObj = currentThreads.find(
            (x) => x.threadId === activeModalThreadId,
          );
          renderPinnedSection(modalCommentsList, currentUserId, threadObj);

          const listContainer = document.getElementById("modalCommentsList");
          listContainer.innerHTML = renderCommentTree(
            modalCommentsList,
            currentUserId,
          );

          const badge = document.getElementById("modalTotalCommentsBadge");
          badge.textContent = `${modalCommentsList.length} dari ${modalTotalComments} Jawaban`;

          if (modalCommentsList.length < modalTotalComments) {
            loadMoreContainer.style.display = "block";
            loadMoreBtn.textContent = `⬇️ Muat Lebih Banyak (${modalCommentsList.length} / ${modalTotalComments})`;
          } else {
            loadMoreContainer.style.display = "none";
          }
        } catch (err) {
          document.getElementById("modalCommentsList").innerHTML = `
          <div style="text-align:center; padding:20px; color:var(--danger);">
            Network error: ${escapeHtml(err.message)}
          </div>
        `;
        } finally {
          modalIsLoading = false;
          spinner.style.display = "none";
        }
      }

      function loadMoreModalComments() {
        if (modalIsLoading) return;
        modalCurrentPage += 1;
        fetchModalComments(modalCurrentPage, true);
      }

      function renderPinnedSection(comments, currentUserId, threadObj) {
        const container = document.getElementById("modalPinnedSection");
        if (!container) return;

        let myComment = null;
        function findMyComment(list) {
          if (!list || myComment) return;
          for (const item of list) {
            if (currentUserId && item.authorId === currentUserId) {
              myComment = item;
              return;
            }
            if (
              item.replies &&
              Array.isArray(item.replies) &&
              item.replies.length > 0
            ) {
              findMyComment(item.replies);
            }
          }
        }
        findMyComment(comments);

        if (myComment) {
          container.innerHTML = `
          <div class="pinned-my-answer">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
              <span class="pinned-badge">⭐ Jawaban Anda (Dipin)</span>
              <span class="comment-date" style="font-weight:600;">📅 ${formatDisplayDate(myComment.postDate)}</span>
            </div>
            <div class="comment-text-body">
              ${renderCommentBody(myComment.commentText)}
            </div>
          </div>
        `;
        } else if (threadObj && threadObj.hasReplied) {
          container.innerHTML = `
          <div class="pinned-my-answer">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; flex-wrap:wrap; gap:8px;">
              <span class="pinned-badge">⭐ Jawaban Anda</span>
              <span class="comment-date">📅 ${formatDisplayDate(threadObj.replyDate)}</span>
            </div>
            <div class="comment-text-body">
              <p>${escapeHtml(threadObj.replyText || "Anda telah menjawab pertanyaan ini (jawaban lengkap tersimpan di server).")}</p>
            </div>
          </div>
        `;
        } else {
          container.innerHTML = `
          <div style="background:var(--bg); border:1px dashed var(--surface-border); border-radius:10px; padding:12px 16px; font-size:0.875rem; color:var(--text-muted); display:flex; align-items:center; gap:10px;">
            <span style="font-size:1.2rem;">📝</span>
            <span>Anda belum menjawab pertanyaan ini. Anda dapat langsung menuliskan jawaban pada form di bawah.</span>
          </div>
        `;
        }
      }

      function renderCommentTree(comments, currentUserId) {
        if (!comments || comments.length === 0) {
          return `<div style="text-align:center; padding:30px; color:var(--text-muted); font-size:0.9rem;">Belum ada jawaban dari mahasiswa lain pada pertanyaan ini.</div>`;
        }

        return comments
          .map((c) => renderSingleCommentCard(c, currentUserId, false))
          .join("");
      }

      function renderSingleCommentCard(c, currentUserId, isNested = false) {
        const isMe = currentUserId && c.authorId === currentUserId;
        const isInstructor = (c.authorRole || "")
          .toLowerCase()
          .includes("instructor");
        const authorName = c.authorfullName || c.authorFullName || "Mahasiswa";
        const roleName = c.authorRole || "Member";
        const postDate = formatDisplayDate(c.postDate);
        const initials = getInitials(authorName);

        let meBadge = isMe
          ? `<span class="badge badge-replied" style="font-size:0.7rem; padding:2px 7px;">⭐ Jawaban Anda</span>`
          : "";
        let roleBadge = isInstructor
          ? `<span class="badge badge-lecturer" style="font-size:0.7rem; padding:2px 7px;">👨‍🏫 ${escapeHtml(roleName)}</span>`
          : "";
        let avatarClass = isMe ? "is-me" : isInstructor ? "is-instructor" : "";

        let repliesHtml = "";
        if (c.replies && Array.isArray(c.replies) && c.replies.length > 0) {
          repliesHtml = `
          <div class="replies-nested-list">
            ${c.replies.map((r) => renderSingleCommentCard(r, currentUserId, true)).join("")}
          </div>
        `;
        }

        return `
        <div class="comment-card ${isMe ? "is-me" : ""}">
          <div class="comment-meta">
            <div class="comment-author-left">
              <div class="avatar-circle ${avatarClass}">
                ${c.authorPictureUrl ? `<img src="${c.authorPictureUrl}" style="width:3rem;height:3rem;object-fit:cover;" alt="${initials}">` : initials}
              </div>
              <div>
                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap;">
                  <span class="author-name-text">${escapeHtml(authorName)}</span>
                  ${meBadge}
                  ${roleBadge}
                </div>
                <div class="comment-date">${postDate}</div>
              </div>
            </div>
          </div>
          <div class="comment-text-body">
            ${renderCommentBody(c.commentText)}
          </div>
          ${repliesHtml}
        </div>
      `;
      }

      function renderCommentBody(rawHtml) {
        if (!rawHtml) return "<p><em>(Tidak ada teks jawaban)</em></p>";
        let safe = rawHtml.replace(
          /<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,
          "",
        );
        safe = safe.replace(
          /<iframe\b[^<]*(?:(?!<\/iframe>)<[^<]*)*<\/iframe>/gi,
          "",
        );
        safe = safe.replace(/on\w+\s*=\s*["'][^"']*["']/gi, "");
        return safe;
      }

      function getInitials(name) {
        if (!name) return "?";
        const parts = name.trim().split(/\s+/);
        if (parts.length === 1) return parts[0].substring(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

        const feedback = document.getElementById("modalFeedback");
        const submitBtn = document.getElementById("modalSubmitBtn");
        const answerText = textarea.value.trim();

        if (!answerText) {
          feedback.className = "submit-feedback error";
          feedback.textContent = "⚠️ Jawaban tidak boleh kosong.";
          return;
        }

        submitBtn.disabled = true;
        feedback.className = "submit-feedback";
        feedback.textContent = "Mengirim jawaban...";

        const threadObj = currentThreads.find(
          (x) => x.threadId === activeModalThreadId,
        );

        try {
          const res = await fetch("/api/answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              thread_id: activeModalThreadId,
              answer_text: answerText,
              class_id: currentClassId,
              session_id: threadObj ? threadObj.sessionId : null,
            }),
          });

          const data = await res.json();
          if (data.success) {
            feedback.className = "submit-feedback success";
            feedback.textContent = "🎉 Jawaban berhasil dikirim!";
            textarea.value = "";

            if (threadObj) {
              threadObj.hasReplied = true;
              threadObj.replyText = answerText;
              threadObj.replyDate = new Date().toISOString();
            }
            renderThreads();

            // Refresh comments in modal
            setTimeout(() => {
              fetchModalComments(1, false);
            }, 600);
          } else {
            feedback.className = "submit-feedback error";
            feedback.textContent = `❌ Gagal: ${data.error}`;
          }
        } catch (err) {
          feedback.className = "submit-feedback error";
          feedback.textContent = `❌ Error: ${err.message}`;
        } finally {
          submitBtn.disabled = false;
